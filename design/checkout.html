<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — JIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head><body>
<header><div class="nav"><a class="logo" href="homepage.html">JIVE</a><ul><li><a href="homepage.html#events">Events</a></li><li><a href="homepage.html#artists">Artists</a></li></ul><a class="pill" href="tickets.html">My tickets</a></div></header>

<main><div class="wrap">
  <!-- Left: the step for the current state. Right: the order, always visible. -->
  <div class="grid2" style="display:grid;grid-template-columns:7fr 5fr;gap:80px;align-items:start">
    <section id="step"></section>
    <aside id="order">
      <h3>Your order</h3>
      <p class="small" style="margin:6px 0 20px">Resonance in ruin · Sat 22 March 2027, 9:00 PM<br>The Heritage Mills, Lower Parel, Mumbai</p>
      <div class="rows">
        <div><span class="name">General entry × 2</span><span>₹3,798</span></div>
        <div><span>Fees</span><span>₹0</span></div>
      </div>
      <div class="total"><span class="small">Total</span><strong>₹3,798</strong></div>
      <div id="hold"></div>
    </aside>
  </div>
</div></main>

<footer><div class="wrap"><span>© 2027 JIVE</span><nav><a href="#">Terms</a><a href="#">Cancellation and refund policy</a><a href="#">Privacy</a><a href="#">Contact</a></nav></div></footer>

<svg width="0" height="0" style="position:absolute"><symbol id="g" viewBox="0 0 24 24"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.5-.2-2.2H12v4.3h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.5z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.6 14.7a7.2 7.2 0 0 1 0-4.6v-3H1.8a12 12 0 0 0 0 10.6l3.8-3z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3A11.6 11.6 0 0 0 12 0 12 12 0 0 0 1.8 6.9l3.8 3c.9-2.7 3.4-5.1 6.4-5.1z"/></symbol></svg>

<script>
/* Each state maps to what the API would tell us:
   signin   → no access token            → GET /auth/google/authorize
   phone    → user.phone missing         → PUT /auth/phone
   review   → booking PENDING + expires_at → POST /bookings/{ref}/checkout, then /verify
   processing → verify outcome PENDING
   failed   → verify outcome FAILED (hold still valid)
   expired  → booking EXPIRED
   limit / soldout → errors from POST /bookings
   confirmed → booking CONFIRMED, tickets being issued */
const q=new URLSearchParams(location.search).get('state')||'review';
const step=document.getElementById('step'),hold=document.getElementById('hold');
const G='<svg class="g"><use href="#g"/></svg>';
const holdBlock=`<p class="small">Your tickets are held for</p><div class="timer" id="t">03:12</div>`;
const S={
 signin:()=>`<h1>Sign in to continue</h1><p style="margin:16px 0 36px">Use your Google account. We will keep your tickets on it, so you can find them again.</p><a class="pill" href="#">${G} Continue with Google</a>`,
 phone:()=>`<h1>Add your phone number</h1><p style="margin:16px 0 36px">We need it to reach you about this event. It is only used for your bookings.</p>
   <form onsubmit="event.preventDefault();location.search='?state=review'"><div class="f"><label for="p">Mobile number</label><input id="p" type="tel" autocomplete="tel" placeholder="+91 98765 43210" required></div><div><button class="pill">Save and continue</button></div></form>`,
 review:()=>`<h1>Review and pay</h1><p style="margin:16px 0 36px">Check your order, then pay securely with Razorpay. Your tickets arrive in your account as soon as the payment is confirmed.</p>
   <div class="rows" style="margin-bottom:36px"><div><span class="name">Booked by</span><span>aarav.mehta@gmail.com</span></div><div><span class="name">Mobile</span><span>+91 98765 43210</span></div></div>
   <button class="pill full" onclick="location.search='?state=processing'">Pay ₹3,798</button>
   <p class="small" style="margin-top:18px">By paying you accept the <a class="link" href="#">cancellation and refund policy</a>.</p>`,
 processing:()=>`<h1>Confirming your payment</h1><p style="margin:16px 0 28px">This usually takes a few seconds. Please keep this page open and do not pay again.</p><div class="notice"><span>Waiting for the bank to confirm.</span></div>`,
 failed:()=>`<h1>The payment did not go through</h1><p style="margin:16px 0 36px">You have not been charged for this attempt. Your tickets are still held, so you can try again, with the same method or another one.</p><button class="pill" onclick="location.search='?state=review'">Try again</button> <a class="link" style="margin-left:20px" href="homepage.html">Back to the event</a>`,
 expired:()=>`<h1>Your hold has ended</h1><p style="margin:16px 0 36px">The time to pay ran out, and these tickets have gone back on sale. If you were charged, the payment will be returned to you.</p><a class="pill" href="homepage.html#tickets">Choose tickets again</a>`,
 limit:()=>`<h1>That is over the limit</h1><p style="margin:16px 0 36px">There is a maximum of four tickets per person for this event. You already hold two, so you can add up to two more.</p><a class="pill" href="homepage.html#tickets">Change quantity</a>`,
 soldout:()=>`<h1>These tickets just sold out</h1><p style="margin:16px 0 36px">Someone else completed their booking first. You have not been charged. You can pick another category if one is left.</p><a class="pill" href="homepage.html#tickets">See what is available</a>`,
 confirmed:()=>`<h1>You are going</h1><p style="margin:16px 0 28px">Your payment is confirmed. Booking reference <span style="color:#fff">JV-7K3QX9</span>.</p><div class="notice"><span>Preparing your tickets…</span></div><div style="margin-top:36px"><a class="pill" href="tickets.html">View my tickets</a></div>`
};
step.innerHTML=(S[q]||S.review)();
if(['review','failed'].includes(q)){hold.innerHTML=holdBlock;let s=192;const t=document.getElementById('t');setInterval(()=>{s=Math.max(0,s-1);t.textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}
if(['expired','limit','soldout','signin','phone'].includes(q)&&q!=='phone'&&q!=='signin'){document.getElementById('order').style.opacity=.5}
</script>
</body></html>
